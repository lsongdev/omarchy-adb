<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="254" viewBox="0 0 1200 254" role="img" aria-labelledby="title">
  <title id="title">from the installed plugin, or a clone; no shell running is needed</title>
  <rect width="1200" height="254" rx="18" fill="#111C18"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#182420"/><rect x="0" y="28" width="1200" height="18" fill="#182420"/>
  
  <text x="40" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">bash · from the installed plugin, or a clone; no shell running is needed</text>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote key KEYCODE_DPAD_DOWN</text><text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote text "jazz piano" enter</text><text x="40" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote clear 30</text><text x="40" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote apps       # launchable packages</text><text x="40" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote status     # up | down | unauth | noadb</text><text x="40" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">TV_ADB_ADDR=192.168.1.50:5555 ./tv-remote reauth     # re-show the debugging prompt</text>
</svg>
