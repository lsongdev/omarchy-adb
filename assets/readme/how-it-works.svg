<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-labelledby="title desc">
  <title id="title">How a key press reaches the TV</title>
  <desc id="desc">Click the bar icon or press the hotkey to open the pad; a key on the pad becomes one call to the tv-remote script, which runs one adb shell command that sends a keyevent to the TV.</desc>
  <rect width="1200" height="200" rx="22" fill="#111C18"/>
  <text x="30" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379" letter-spacing="2.4">HOW A KEY PRESS REACHES THE TV</text>
  <rect x="30" y="60" width="196" height="84" rx="10" fill="#1F2926"/><text x="128.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E6EBD4">bar icon</text><text x="128.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">click, or a hotkey</text><path d="M234 102 h30 M256 95 l8 7 l-8 7" fill="none" stroke="#98C379" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="272" y="60" width="196" height="84" rx="10" fill="#263A31" stroke="#98C379" stroke-width="1.5"/><text x="370.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E6EBD4">pad</text><text x="370.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">W = KEYCODE_DPAD_UP</text><path d="M476 102 h30 M498 95 l8 7 l-8 7" fill="none" stroke="#98C379" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="60" width="196" height="84" rx="10" fill="#1F2926"/><text x="612.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E6EBD4">tv-remote</text><text x="612.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">one shim call</text><path d="M718 102 h30 M740 95 l8 7 l-8 7" fill="none" stroke="#98C379" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="756" y="60" width="196" height="84" rx="10" fill="#1F2926"/><text x="854.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E6EBD4">adb</text><text x="854.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">adb -s host:5555</text><path d="M960 102 h30 M982 95 l8 7 l-8 7" fill="none" stroke="#98C379" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="998" y="60" width="196" height="84" rx="10" fill="#1F2926"/><text x="1096.0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#E6EBD4">Android TV</text><text x="1096.0" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">input keyevent</text>
  <text x="30" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#788463">Every action is one shim call; the shim reconnects over wifi on demand, so a sleeping TV is a blip, not a setup step.</text>
</svg>
