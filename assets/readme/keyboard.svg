<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">The keyboard while the pad is open</title>
  <desc id="desc">A keyboard with the bound keys highlighted: W A S D and the arrows are the D-pad, Enter is OK, B or Backspace is back, H home, M menu, I inputs, C clear, P play, R rewind, F forward, brackets previous and next, minus and equals volume, X mute, 1 2 3 the app shortcuts, T or slash to type, Tab next TV, Esc or Q close; Shift+W wake, Shift+S power, Alt+1 2 3 jump to a TV.</desc>
  <rect width="1200" height="450" rx="22" fill="#111C18"/>
  <text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379" letter-spacing="2.4">THE KEYBOARD WHILE THE PAD IS OPEN</text>
  <text x="36" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#788463">Highlighted keys are remote keys. Press T to type at the TV instead; Esc hands the keyboard back.</text>
