<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">The bar icon</title>
  <desc id="desc">Left click or SUPER+SHIFT+T opens the pad; right click opens the input picker; middle click sends Home; scrolling over the icon changes the TV volume.</desc>
  <rect width="1200" height="210" rx="22" fill="#111C18"/>
  <text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379" letter-spacing="2.4">THE BAR ICON</text>
  <g transform="translate(40 84)">
    <rect x="0" y="0" width="300" height="34" rx="8" fill="#182420"/>
    <circle cx="24" cy="17" r="4" fill="#788463"/><circle cx="52" cy="17" r="4" fill="#788463"/><circle cx="80" cy="17" r="4" fill="#788463"/><circle cx="108" cy="17" r="4" fill="#788463"/>
    <rect x="136" y="2" width="30" height="30" rx="6" fill="#1F2926" stroke="#98C379" stroke-width="1.5"/><path transform="translate(141 27) scale(0.02667 -0.02667)" d="M84 735H666Q701 735 725.5 710.5Q750 686 750 651V69Q750 34 725.5 9.5Q701 -15 666 -15H84Q49 -15 24.5 9.5Q0 34 0 69V651Q0 686 24.5 710.5Q49 735 84 735ZM541 194 666 526Q667 526 563 526L500 339Q499 339 437 526H84V444H209V194H291V444H365L459 194Z" fill="#E6EBD4" fill-rule="evenodd"/><circle cx="200" cy="17" r="4" fill="#788463"/><circle cx="228" cy="17" r="4" fill="#788463"/><circle cx="256" cy="17" r="4" fill="#788463"/>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#788463">the widget, in the bar; it takes the theme's</text>
    <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#788463">urgent colour when the TV is unreachable</text>
  </g>
  <rect x="380" y="70" width="188" height="110" rx="12" fill="#1F2926" stroke="#98C379" stroke-width="1.5"/><text x="396" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#E6EBD4">left click</text><text x="396" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">SUPER+SHIFT+T</text><text x="396" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">open the pad</text><rect x="580" y="70" width="188" height="110" rx="12" fill="#1F2926" stroke="#98C379" stroke-width="1.5"/><text x="596" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#E6EBD4">right click</text><text x="596" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">input / source picker</text><rect x="780" y="70" width="188" height="110" rx="12" fill="#1F2926" stroke="#98C379" stroke-width="1.5"/><text x="796" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#E6EBD4">middle click</text><text x="796" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">home</text><rect x="980" y="70" width="188" height="110" rx="12" fill="#1F2926" stroke="#98C379" stroke-width="1.5"/><text x="996" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#E6EBD4">scroll</text><text x="996" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">over the icon</text><text x="996" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">TV volume</text>
</svg>
