<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="194" viewBox="0 0 1200 194" role="img" aria-labelledby="title">
  <title id="title">the installed checkout is a git clone</title>
  <rect width="1200" height="194" rx="18" fill="#111C18"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#182420"/><rect x="0" y="28" width="1200" height="18" fill="#182420"/>
  
  <text x="40" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">bash · the installed checkout is a git clone</text>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">$EDITOR ~/.config/omarchy/plugins/io.github.swey-l1.atv-remote/Panel.qml</text><text x="40" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">omarchy restart shell</text><text x="40" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">./test/tv-remote.sh                 # the shim against a fake adb</text><text x="40" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">omarchy plugin update io.github.swey-l1.atv-remote    # pull new commits</text>
</svg>
