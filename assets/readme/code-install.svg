<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122" viewBox="0 0 1200 122" role="img" aria-labelledby="title">
  <title id="title">any terminal on the omarchy machine</title>
  <rect width="1200" height="122" rx="18" fill="#111C18"/>
  <rect x="0" y="0" width="1200" height="46" rx="18" fill="#182420"/><rect x="0" y="28" width="1200" height="18" fill="#182420"/>
  
  <text x="40" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#788463">bash · any terminal on the omarchy machine</text>
  <text x="40" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379">$</text><text x="62" y="74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#E6EBD4" xml:space="preserve">omarchy plugin add https://github.com/swey-l1/omarchy-android-tv-remote --enable</text><text x="40" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#788463">--enable is what puts the widget into the bar; without it the plugin installs and nothing appears.</text>
</svg>
