<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">The widget's entry in shell.json</title>
  <desc id="desc">An example entry: id io.github.swey-l1.atv-remote, up to three TVs as tvNLabel and tvNAddress pairs, activeSlot for the TV being driven, pollSec for the reachability interval, and appNLabel plus appNPackage for the three shortcut buttons.</desc>
  <rect width="1200" height="440" rx="22" fill="#111C18"/>
  <text x="36" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#98C379" letter-spacing="2.4">~/.config/omarchy/shell.json  →  bar.layout.&lt;section&gt;</text>
  <rect x="40" y="60" width="500" height="352" rx="12" fill="#182420"/>
  <text x="60" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#788463">{</text><text x="84" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"id": "io.github.swey-l1.atv-remote",</text><text x="84" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"tv1Label": "Living room",</text><text x="84" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"tv1Address": "192.168.1.50:5555",</text><text x="84" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"tv2Label": "Bedroom",</text><text x="84" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"tv2Address": "192.168.1.51:5555",</text><text x="84" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"activeSlot": 1,</text><text x="84" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"pollSec": 60,</text><text x="84" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"app1Label": "NFLX",</text><text x="84" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#B8C497">"app1Package": "com.netflix.ninja"</text><text x="60" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#788463">}</text><path d="M560 146 h40" stroke="#98C379" stroke-width="1.5" stroke-dasharray="3 4"/><text x="612" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">tv1..tv3: a name and host:port each; the pad writes these</text><path d="M560 266 h40" stroke="#98C379" stroke-width="1.5" stroke-dasharray="3 4"/><text x="612" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">the slot being driven; the picker writes it</text><path d="M560 296 h40" stroke="#98C379" stroke-width="1.5" stroke-dasharray="3 4"/><text x="612" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">seconds between reachability checks</text><path d="M560 326 h40" stroke="#98C379" stroke-width="1.5" stroke-dasharray="3 4"/><text x="612" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" fill="#98C379">the three shortcut buttons: a label and a package</text>
  <text x="612" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" fill="#788463">Every key is optional; with no address, the shim uses the first adb device.</text>
</svg>
